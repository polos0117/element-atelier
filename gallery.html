<title>원소의 공방</title>
<!-- 전시관(2026-11-02, 사용자 「감상용 디지털 아카이브 — 레이어 줌인 · 원형 구조」).
     도감(dex.html)은 그림을 채우는 작업 화면(빈 칸 → 생성기 · 장 수)이고, 여기는 그려진 카드만 거는 감상 화면이다.
     층: 섬(나라들) → 나라(가운데 근본, 둘레 궤도에 가문주 — 원자와 전자) → 가문(가문주 크게, 주민은 액자) → 한 장(화면 가득).
     세계(판타지 · 스팀펑크 · 메카)는 어느 층에서든 위에 늘 있고, 바꾸면 같은 카드가 그 세계 그림으로 넘어간다(새 그림이 스르르).
     그 세계에 안 살거나 아직 안 그린 카드는 다른 세계의 그림을 「…의 그림」 표시와 함께 건다. 그림이 하나도 없는 카드는 걸지 않는다.
     사실 칸은 설계표 elements 의 것만(번호 · 기호 · 주기 · 족 · 분류 · 상태) — 지어낸 수치는 없다(AGENTS 3).
     주소 ?n=&f=&c=&w=&v=1 — 층마다 뒤로 가기가 한 층씩 올라간다. -->

<body class="gallery-page">
<div id="app"></div>
<script type="module">
import {h,render} from 'https://esm.sh/preact@10.24.3';
import {useState,useEffect,useRef} from 'https://esm.sh/preact@10.24.3/hooks';
import {PAGES} from './lib/workspace-ui.js?v=5';
import * as FX from './lib/motion-fx.js?v=1';
/* 누른 것의 자리 — 다음 층 · 미리 보기 · 한 장의 그림이 거기서 날아와 커진다(lib/motion-fx.js flyFrom, 뷰 전환 대신 한 장만) */
let FROM=null;
const from=e=>{try{FROM=e.currentTarget.getBoundingClientRect();}catch(x){FROM=null;}};
const fromSel=sel=>{const el=document.querySelector(sel);FROM=el?el.getBoundingClientRect():null;};
const land=sel=>{FX.flyFrom(FROM,document.querySelector(sel));FROM=null;};
const W=window.W,IMG=window.AtelierImg;
/* 한 장 보기의 키 — 페이지에 한 번 걸고, 그리는 한 장이 처리기를 바꿔 끼운다 */
let LORE_KEY=null;
addEventListener('keydown',e=>{if(LORE_KEY&&!e.defaultPrevented)LORE_KEY(e);});
/* 층 바꾸기 — 뷰 전환(화면을 찍어 섞기)은 폰에서 한 번에 3초 넘게 터치를 붙잡아 뺐다(2026-11-02 「여기만 화면 로딩이랑 전환이 느리다」).
   새 층이 살짝 커지며 나타나는 CSS 움직임(.g-main > * — 투명도 · 크기만)으로 대신한다 */
function transition(fn){fn();}
const readURL=()=>{const q=new URLSearchParams(location.search);return {n:q.get('n')||'',f:q.get('f')||'',c:q.get('c')||'',w:q.get('w')||'',v:q.get('v')==='1'};};
const writeURL=(st,push)=>{const q=new URLSearchParams();for(const k of ['n','f','c','w'])if(st[k])q.set(k,st[k]);if(st.v)q.set('v','1');const u=location.pathname+(q.toString()?'?'+q:'');try{history[push?'pushState':'replaceState'](push?{g:1}:history.state,'',u);}catch(e){}};
function useDocs(){
  const [doc,setDoc]=useState(null);
  useEffect(()=>{
    Promise.all([
      fetch('data/element-design.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status)))),
      fetch('data/style.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status)))),
      fetch(IMG.DATA,{cache:'no-cache'}).then(r=>r.ok?r.json():{img:{}}).catch(()=>({img:{}}))
    ]).then(([d,s,i])=>{IMG.setShards(i);IMG.setAdded(i);setDoc({d,s,img:i.img||{}});}).catch(()=>setDoc({failed:true}));
  },[]);
  return doc;
}
/* 카드의 세계 그림 — 기본 화풍 먼저, 없으면 등록된 다른 화풍 */
function fileOf(doc,key,world){
  const e=doc.img[key];if(!e)return null;const m=IMG.styleMap(e);
  const order=[doc.s.default,...Object.keys(m).filter(k=>k!==doc.s.default)];
  for(const st of order){const f=m[st]&&IMG.formMap(m[st])[world];if(f&&f.f)return f.f;}
  return null;
}
/* 이 세계로 걸 그림 — 그 세계 그림이 없으면 다른 세계의 것(from 표시) */
function pick(doc,card,w){
  const f=fileOf(doc,card.key,w);if(f)return {file:f,world:w};
  for(const x of doc.d.vocab.worlds){const g=fileOf(doc,card.key,x);if(g)return {file:g,world:x,from:true};}
  return null;
}
/* 한 나라의 카드들 */
function nationCards(doc,n){
  const all=doc.d.vocab.worlds,e=doc.d.elements.find(x=>x.key===n.key)||{};
  const root={key:n.key,tier:'root',name:e.ko,en:e.en,worlds:all,nation:n,el:e};
  const lords=(n.families||[]).map(f=>{const fk=n.key+'-'+f.key;
    return {key:fk,tier:'lord',name:W('dex.lord.name',{family:f.ko}),en:f.en,worlds:all,nation:n,family:f,el:e,
      citizens:(f.citizens||[]).map(c=>({key:fk+'-'+c.key,tier:'citizen',name:c.ko,en:c.en,worlds:c.worlds||[],nation:n,family:f,citizen:c,el:e}))};});
  return {root,lords};
}
const has=(doc,card)=>!!pick(doc,card,doc.d.vocab.worlds[0]);
function Pic({doc,card,w,big,cls}){
  const p=pick(doc,card,w);if(!p)return null;
  const src=big?IMG.imgURL(p.file):IMG.thumbURL(p.file);
  /* 큰 그림은 원본(약 480KB)이 오는 동안 썸네일(약 40KB)을 먼저 깔아 둔다 */
  return h('span',{class:'pic'+(cls?' '+cls:''),style:Object.assign({},big?{backgroundImage:'url("'+IMG.thumbURL(p.file)+'")'}:{})},
    h('img',{key:p.file+(big?'#b':''),src,alt:'',loading:big?'eager':'lazy',decoding:'async',onError:e=>{e.target.onerror=null;e.target.src=IMG.imgURL(p.file);}}),
    p.from&&h('span',{class:'from'},W('gallery.from',{world:W('world.'+p.world)})));
}
const list=v=>Array.isArray(v)?v:(v?String(v).split(/\s*,\s*/).filter(Boolean):[]);   /* 성질 — 나라는 줄 목록, 가문은 쉼표 한 줄 */
const facts=el=>[W('fact.number')+' '+el.number,W('fact.period')+' '+el.period,el.group?W('fact.group')+' '+el.group:'',W('cat.'+el.category),W('state.'+el.state)].filter(Boolean);
/* 위 막대 — 타이틀 · 지금 자리 · 세계 · 공방 화면 */
function Bar({doc,st,go,setW}){
  const n=st.n&&doc.d.nations.find(x=>x.key===st.n),el=n&&doc.d.elements.find(x=>x.key===n.key),f=n&&st.f&&(n.families||[]).find(x=>x.key===st.f);
  const crumbs=[h('button',{type:'button',onClick:()=>go({n:'',f:'',c:'',v:false})},W('gallery.title'))];
  if(n)crumbs.push(h('button',{type:'button',onClick:()=>go({n:n.key,f:'',c:'',v:false})},el.symbol+' '+el.ko));
  if(f)crumbs.push(h('button',{type:'button',onClick:()=>go({n:n.key,f:f.key,c:'',v:false})},W('dex.lord.name',{family:f.ko})));
  return h('header',{class:'g-bar'},
    h('a',{class:'g-home',href:'index.html'},h('span',{'aria-hidden':'true'},'◇'),h('b',null,W('app.title'))),
    h('nav',{class:'g-crumbs','aria-label':W('gallery.crumbs')},crumbs.map((c,i)=>[i?h('i',{key:'s'+i,'aria-hidden':'true'},'›'):null,c])),
    h('div',{class:'g-worlds',role:'group','aria-label':W('gallery.world')},doc.d.vocab.worlds.map(w=>h('button',{key:w,type:'button','data-w':w,'aria-pressed':st.w===w,onClick:()=>setW(w)},W('world.'+w)))),
    h('nav',{class:'g-pages','aria-label':W('gallery.nav')},PAGES.filter(k=>k!=='gallery').map(k=>h('a',{key:k,href:k+'.html'},W('nav.'+k)))));
}
/* 섬 — 그림이 걸린 나라들 */
function Island({doc,st,go}){
  const ns=doc.d.nations.filter(n=>has(doc,nationCards(doc,n).root));
  if(!ns.length)return h('p',{class:'g-note'},W('gallery.empty'));
  return h('section',{class:'g-island'},
    h('h1',null,W('gallery.island',{n:ns.length})),h('p',{class:'g-note'},W('gallery.island.note')),
    h('ul',{class:'g-nations'},ns.map(n=>{const {root,lords}=nationCards(doc,n),el=root.el;
      return h('li',{key:n.key},h('button',{type:'button',class:'g-tile','data-n':n.key,'aria-label':W('gallery.enter',{name:el.ko}),onClick:e=>{from(e);go({n:n.key,f:'',c:'',v:false});}},
        h(Pic,{doc,card:root,w:st.w}),
        h('span',{class:'g-tile-cap'},h('span',{class:'sym'},el.symbol),h('span',{class:'num'},el.number),h('b',null,el.ko),h('small',null,el.en+' · '+W('gallery.families',{n:lords.filter(l=>has(doc,l)).length})))));})));
}
/* 나라 — 가운데 근본, 둘레 궤도에 가문주 */
/* 나라 무대 — 원소마다 생성한 궤도 그림(그림 저장소 backgrounds/orbits/orbit-<나라>.webp, 기록 records/backgrounds/orbit-<나라>.json)에 글자만 얹는다.
   큰 고리 반지름(너비 대비)은 그림마다 재서 기록의 ring 에 둔 값 — 가문 이름표가 그 고리 위에 앉는다(2026-11-02 「궤도 이미지를 원소별로, 텍스트로만, 누르면 큰 이미지, 거기서 크게 보기」) */
const ORBIT='https://polos0117.github.io/element-atelier-img/backgrounds/orbits/orbit-';
const RING={fe:.43,h:.407,o:.419,c:.398,na:.43,au:.428,og:.405};
/* 미리 보기 — 이름표를 누르면 뜨는 큰 그림. 여기서 크게 보기(한 장) · 주민 보기(가문) */
function Peek({doc,st,go,card,close}){
  useEffect(()=>{const k=e=>{if(e.key==='Escape')close();};addEventListener('keydown',k);return ()=>removeEventListener('keydown',k);},[]);
  useEffect(()=>{FX.pop(document.querySelector('.g-peek'),.96);land('.g-peek-pic .pic');},[card.key]);   /* 이름표에서 그림이 날아와 커진다 */
  const text=card.tier==='root'?card.nation.persona:card.family.persona,n=card.tier==='lord'?card.citizens.filter(c=>has(doc,c)).length:0;
  return h('div',{class:'g-peek-wrap',onClick:e=>{if(e.target===e.currentTarget)close();}},
    h('section',{class:'g-peek',role:'dialog','aria-modal':'true','aria-label':card.name},
      h('button',{type:'button',class:'g-peek-pic','data-act':'open','aria-label':W('gallery.open',{name:card.name}),onClick:()=>{fromSel('.g-peek-pic .pic');go({c:card.key,v:true});}},h(Pic,{doc,card,w:st.w,big:true})),
      h('div',{class:'g-peek-text'},
        h('p',{class:'g-tier'},W('gallery.tier.'+card.tier)+' · '+card.el.symbol+' '+card.el.ko),
        h('h2',null,card.name,h('small',null,card.en)),
        h('p',{class:'g-peek-persona'},text),
        h('div',{class:'g-peek-acts'},
          h('button',{type:'button',class:'g-act main','data-act':'open',onClick:()=>{fromSel('.g-peek-pic .pic');go({c:card.key,v:true});}},W('gallery.peek.open')),
          card.tier==='lord'&&n>0&&h('button',{type:'button',class:'g-act','data-act':'family',onClick:()=>{fromSel('.g-peek-pic .pic');go({f:card.family.key,c:'',v:false});}},W('gallery.peek.family',{n})),
          h('button',{type:'button',class:'g-act','data-act':'close',onClick:close},W('gallery.close'))))));
}
function Nation({doc,st,go,n}){
  const {root,lords}=nationCards(doc,n),el=root.el,shown=lords.filter(l=>has(doc,l)),N=shown.length,r=(RING[n.key]||.41)*100;
  const world=n.worlds&&n.worlds[st.w],[peek,setPeek]=useState(null);
  useEffect(()=>setPeek(null),[n.key]);
  /* 나라에 들어오면 — 누른 카드에서 무대가 커지고, 가문 이름표가 핵에서 튀어나와 궤도 자리로 */
  useEffect(()=>{land('.g-stage');FX.burst(document.querySelectorAll('.g-node'),(document.querySelector('.g-nucleus')||{getBoundingClientRect:()=>null}).getBoundingClientRect());},[n.key]);
  return h('section',{class:'g-nation'},
    h('div',{class:'g-stage',style:{'--orbit':'url("'+ORBIT+n.key+'.webp")'}},
      h('svg',{class:'g-spin',viewBox:'0 0 100 100','aria-hidden':'true'},h('circle',{cx:50,cy:50,r:r})),
      h('button',{type:'button',class:'g-nucleus','data-card':root.key,'aria-label':W('gallery.node',{name:root.name}),onClick:e=>{from(e);setPeek(root);}},
        h('span',{class:'g-nuc-cap'},h('b',null,el.symbol),' '+el.ko)),
      shown.map((l,i)=>{const a=(i/N)*2*Math.PI-Math.PI/2,x=50+Math.cos(a)*r,y=50+Math.sin(a)*r;
        return h('button',{key:l.key,type:'button',class:'g-node'+(x<38?' l':x>62?' r':''),'data-f':l.family.key,style:{left:x.toFixed(2)+'%',top:y.toFixed(2)+'%','--i':i},'aria-label':W('gallery.node',{name:l.name}),onClick:e=>{from(e);setPeek(l);}},l.family.ko);})),
    h('div',{class:'g-text'},
      h('p',{class:'g-sym'},h('span',null,el.symbol),h('small',null,el.number)),
      h('h1',null,el.ko,h('small',null,el.en)),
      h('p',{class:'g-facts'},facts(el).join(' · ')),
      h('p',{class:'g-persona'},n.persona),
      world&&h('div',{class:'g-world'},h('h2',null,W('gallery.world.text')+' · '+W('world.'+st.w)),h('p',null,world.ko)),
      n.traits&&list(n.traits.ko).length>0&&h('ul',{class:'g-traits'},list(n.traits.ko).map((t,i)=>h('li',{key:i},t))),
      h('a',{class:'g-dex',href:'dex.html?nation='+n.key},W('gallery.dex'))),
    peek&&h(Peek,{doc,st,go,card:peek,close:()=>setPeek(null)}));
}
/* 가문 — 가문주 크게, 주민은 액자 */
function Family({doc,st,go,n,lord}){
  useEffect(()=>{land('.g-hero .pic');FX.stagger(document.querySelectorAll('.g-cit'),{y:16,each:.06});},[lord.key]);   /* 미리 보기 그림이 가문주 자리로, 주민 액자는 차례로 */
  const f=lord.family,cits=lord.citizens.filter(c=>has(doc,c));
  const shared=(f.elements||[]).filter(k=>k!==n.key).map(k=>doc.d.elements.find(e=>e.key===k)).filter(Boolean);
  return h('section',{class:'g-family'},
    h('div',{class:'g-fam-top'},
      h('button',{type:'button',class:'g-hero','aria-label':W('gallery.open',{name:lord.name}),onClick:()=>{fromSel('.g-hero .pic');go({c:lord.key,v:true});}},h(Pic,{doc,card:lord,w:st.w,big:true})),
      h('div',{class:'g-text'},
        h('p',{class:'g-tier'},W('gallery.tier.lord')+' · '+lord.el.symbol+' '+lord.el.ko),
        h('h1',null,lord.name,h('small',null,f.en)),
        h('p',{class:'g-persona'},f.persona),
        f.traits&&list(f.traits.ko).length>0&&h('ul',{class:'g-traits'},list(f.traits.ko).map((t,i)=>h('li',{key:i},t))),
        shared.length>0&&h('p',{class:'g-shared'},W('gallery.shared')+' — ',shared.map((e,i)=>[i?', ':'',h('button',{key:e.key,type:'button',onClick:()=>go({n:e.key,f:f.key,c:'',v:false})},e.symbol+' '+e.ko)])),
        h('a',{class:'g-dex',href:'dex.html?nation='+n.key+'&card='+encodeURIComponent(lord.key)},W('gallery.dex')))),
    cits.length>0&&h('div',{class:'g-cits'},
      h('h2',null,W('gallery.citizens',{n:cits.length})),
      h('ul',null,cits.map(c=>h('li',{key:c.key},h('button',{type:'button',class:'g-cit','data-c':c.key,'aria-label':W('gallery.open',{name:c.name}),onClick:e=>{from(e);go({c:c.key,v:true});}},
        h(Pic,{doc,card:c,w:st.w}),h('span',{class:'g-cit-cap'},h('b',null,c.name),h('small',null,c.en))))))));
}
/* 한 장 — 화면 가득. ← → 로 세계, Esc 로 닫기, 밀어서 넘기기 */
function Lore({doc,st,go,setW,card}){
  const all=doc.d.vocab.worlds,lives=all.filter(w=>fileOf(doc,card.key,w)),touch=useRef(null);
  const step=d=>{if(lives.length<2)return;const i=lives.indexOf(st.w);setW(lives[((i<0?0:i)+d+lives.length)%lives.length]);};
  const close=()=>{if(history.state&&history.state.g)history.back();else go({c:'',v:false});};   /* 이 전시관 안에서 열었으면 뒤로 — 닫은 뒤 뒤로 가기가 다시 한 장을 열지 않게 */
  LORE_KEY=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);};   /* 그리는 순간부터 받는다(효과를 기다리지 않는다) */
  /* 다른 세계 그림을 미리 받아 둔다 — ← → 로 넘길 때 기다리지 않게 */
  useEffect(()=>{land('.g-lore-pic');},[card.key]);   /* 누른 그림에서 날아와 화면 가득 */
  useEffect(()=>{lives.filter(w=>w!==st.w).forEach(w=>{const f=fileOf(doc,card.key,w);if(f){const i=new Image();i.decoding='async';i.src=IMG.imgURL(f);}});},[card.key]);
  const p=pick(doc,card,st.w),el=card.el,world=card.tier==='root'&&card.nation.worlds&&card.nation.worlds[st.w];
  const motif=card.citizen&&card.citizen.object&&card.citizen.object.en,note=card.citizen&&card.citizen.notes&&card.citizen.notes[st.w];
  const persona=card.tier==='root'?card.nation.persona:card.family.persona;
  return h('section',{class:'g-lore',role:'dialog','aria-modal':'true','aria-label':card.name,
      onTouchStart:e=>{touch.current=e.touches[0].clientX;},onTouchEnd:e=>{if(touch.current==null)return;const dx=e.changedTouches[0].clientX-touch.current;touch.current=null;if(Math.abs(dx)>50)step(dx<0?1:-1);}},
    h('button',{type:'button',class:'g-close',onClick:close},W('gallery.close')),   /* 맨 앞 — 폰에선 위에 붙어 늘 보인다 */
    p&&h('div',{class:'g-lore-bg','aria-hidden':'true',style:{backgroundImage:'url("'+IMG.thumbURL(p.file)+'")'}}),
    h('div',{class:'g-lore-stage'},
      lives.length>1&&h('button',{type:'button',class:'g-step prev','aria-label':W('gallery.prev'),onClick:()=>step(-1)},'‹'),
      h(Pic,{doc,card,w:st.w,big:true,cls:'g-lore-pic'}),
      lives.length>1&&h('button',{type:'button',class:'g-step next','aria-label':W('gallery.next'),onClick:()=>step(1)},'›')),
    h('div',{class:'g-text g-lore-text',key:card.key+st.w},
      h('p',{class:'g-tier'},W('gallery.tier.'+card.tier)+' · '+el.symbol+' '+el.ko+(card.family&&card.tier==='citizen'?' · '+W('dex.lord.name',{family:card.family.ko}):'')),
      h('h1',null,card.name,h('small',null,card.en)),
      card.tier==='root'&&h('p',{class:'g-facts'},facts(el).join(' · ')),
      h('p',{class:'g-persona'},persona),
      world&&h('p',{class:'g-world-line'},W('world.'+st.w)+' — '+world.ko),
      motif&&h('p',{class:'g-motif'},h('b',null,W('gallery.motif')),' '+(note&&note.en||motif)),
      h('p',{class:'g-lives'},W('gallery.lives')+' — '+card.worlds.map(w=>W('world.'+w)).join(' · '))));
}
function App(){
  const doc=useDocs(),[st,setSt]=useState(()=>{const u=readURL();return Object.assign(u,{w:u.w||'fantasy'});});
  useEffect(()=>{const pop=()=>transition(()=>setSt(s=>Object.assign({},readURL(),{w:readURL().w||s.w})));addEventListener('popstate',pop);return ()=>removeEventListener('popstate',pop);},[]);
  const go=patch=>transition(()=>setSt(s=>{const n=Object.assign({},s,patch);writeURL(n,true);window.scrollTo(0,0);return n;}));
  /* 세계 바꾸기는 뷰 전환 없이 — 화면 전체를 찍어 섞는 값이 폰에서 3초 넘게 걸렸다(2026-11-02 「여기만 느리다」). 그림만 새로 깔리며 스르르 */
  const setW=w=>setSt(s=>{const n=Object.assign({},s,{w});writeURL(n,false);return n;});
  useEffect(()=>{document.documentElement.dataset.world=st.w;},[st.w]);
  /* 위 막대 높이 — 한 장 보기가 그 아래에 앉는다(폰에선 막대가 세 줄) */
  useEffect(()=>{const set=()=>{const b=document.querySelector('.g-bar');if(b)document.documentElement.style.setProperty('--bar-h',b.offsetHeight+'px');};set();const ro=window.ResizeObserver?new ResizeObserver(set):null;const b=document.querySelector('.g-bar');if(ro&&b)ro.observe(b);addEventListener('resize',set);return ()=>{if(ro)ro.disconnect();removeEventListener('resize',set);};},[doc]);
  if(!doc)return h('p',{class:'g-note g-wait'},W('gallery.loading'));
  if(doc.failed)return h('p',{class:'g-note g-wait'},W('gallery.fail'));
  const n=st.n&&doc.d.nations.find(x=>x.key===st.n),cards=n&&nationCards(doc,n);
  const lord=cards&&st.f&&cards.lords.find(l=>l.family.key===st.f);
  const all=cards?[cards.root,...cards.lords,...cards.lords.flatMap(l=>l.citizens)]:[];
  const card=st.v&&st.c&&all.find(c=>c.key===st.c);
  let body;
  if(!card)LORE_KEY=null;
  if(card)body=h(Lore,{doc,st,go,setW,card});
  else if(lord)body=h(Family,{doc,st,go,n,lord});
  else if(n)body=h(Nation,{doc,st,go,n});
  else body=h(Island,{doc,st,go});
  return h('div',{class:'g-shell'},h(Bar,{doc,st,go,setW}),h('main',{class:'g-main',key:(st.n||'')+'/'+(st.f||'')+'/'+(st.v?st.c:'')},body));
}
render(h(App),document.getElementById('app'));
window.AtelierFresh.watch();
</script>
