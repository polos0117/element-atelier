name: 그림 등록

# 그림 저장소(element-atelier-img · element-atelier-img-2)의 img/ 를 읽어 data/img.json 에 적고 되커밋한다.
# 같은 자리에서 첫 저장소의 records/ 로 일상컷 색인(data/casual-index.json)도 다시 쓴다(2026-11-17).
# 깨우는 길은 셋이다.
#   repository_dispatch — 그림 저장소의 썸네일 워크플로가 끝나면서 보낸다(토큰이 있을 때).
#   schedule            — 뒤받침. GitHub 시간표는 자주 밀리고 빠진다(8시간에 1번 돈 적이 있다).
#   workflow_dispatch   — 기다리기 싫으면 Actions 에서 "Run workflow".
# 달라진 것이 없으면 커밋하지 않는다. 썸네일은 그림 저장소의 워크플로가 만든다.
on:
  repository_dispatch:
    types: [images-updated]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: '적혀 있는데 파일이 없는 항목도 지운다'
        type: boolean
        default: false

concurrency:
  group: register-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 그림 저장소를 옆에 받아 img/ 로 잇는다. img/ 는 .gitignore 라 커밋에 안 들어간다
      - uses: actions/checkout@v4
        with:
          repository: polos0117/element-atelier-img
          path: img-repo

      # 둘째 저장소(2026-11-13 부터 열림 — 첫 저장소가 찼다). 못 받아도 등록은 돈다(등록기가 "못 받은 저장소" 로 보고 그쪽 자리를 지킨다)
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: polos0117/element-atelier-img-2
          path: img-repo-2

      # 그림이 아직 없으면 폴더도 없다 — 빈 폴더를 만들어 두고 잇는다
      - name: 그림 자리 잇기
        run: |
          mkdir -p img-repo/img && ln -s img-repo/img img && ls img | head -20
          if [ -d img-repo-2/img ]; then ln -s img-repo-2/img img-2 && ls img-2 | head -5; else echo "element-atelier-img-2 없음 — 새 그림은 첫 저장소로"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 무엇이 달라지는지 먼저 찍어 둔다. 이름이 틀린 파일이 있으면 여기서 실패한다
      - name: 대조
        run: python3 tools/register-images.py --check

      - name: 등록
        run: |
          if [ "${{ inputs.prune || github.event.client_payload.prune }}" = "true" ]; then
            python3 tools/register-images.py --prune
          else
            python3 tools/register-images.py
          fi

      # 자료·등록기·화면이 같은 말을 하는지 — 깨지면 커밋하지 않는다
      - name: 검사
        run: |
          node tests/img-shards.cjs
          python3 tests/register-images.py

      # 일상컷 색인(2026-11-17) — 그림 저장소 records 의 일상컷 기록 · 계획에서 data/casual-index.json(허브 「일상컷 목록」 이 읽는다).
      # 그림은 안 읽는다. 내용이 같으면 쓰지 않는다. 깨져도 그림 등록은 막지 않는다(검사가 깨지면 색인은 옛것 그대로)
      - name: 일상컷 색인
        continue-on-error: true
        run: |
          node tests/casual-index.cjs
          node tools/casual-index.cjs --img img-repo

      - name: 되커밋
        run: |
          if git diff --quiet -- data/img.json data/casual-index.json; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/img.json data/casual-index.json
          git commit -m "자동 등록: 그림 저장소의 새 그림을 data/img.json 에 · 일상컷 색인 [skip actions]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
