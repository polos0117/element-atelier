<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style><script>addEventListener('pageswap', e => { const t = e.viewTransition; if (t) { t.skipTransition(); t.ready.catch(() => {}); } }); addEventListener('pagereveal', e => { const t = e.viewTransition; if (t) t.ready.catch(() => {}); });</script>   <!-- 공방 지도(polos0117.github.io)의 문에서 넘어올 때 페이드로 들어온다(2026-11-12 — 그쪽 README 「방에 들어가는 연출」). 여기서 나갈 때는 전환을 걸지 않아 공방 안에서 쪽을 옮길 때는 전과 같다. 모르는 브라우저는 그냥 넘어온다 -->
<!-- 원소 합성(2026-11-12 사용자 「Phaser — 그림으로 놀기 … 원소 둘을 붙여 물질 만들기 … 이것도 해볼까?」 → 「합성 + 수집」).
     근본 원소 패를 하나 ~ 셋 골라 합성로에 넣고 「합성」 — 설계표에서 그 원소 묶음으로 된 물질(가문)이 있으면 나라마다 가문주 카드가 뒤집히며 열리고 수집첩에 모인다.
     규칙 · 자료는 lib/alchemy.js(node 검사 tests/alchemy.cjs), 그리는 것은 여기 Phaser(jsdelivr phaser@4.2.1). 찾은 것은 이 기기에(element_alchemy_v1).
     캔버스는 논리 크기를 두 배(840×1720)로 짓고 화면에 맞춰 줄인다 — 폰의 높은 화소 밀도에서도 글자가 흐리지 않게.
     원소 패는 캔버스 밖 HTML 단추 판(#tray, 2026-11-13 — 나라 마흔일곱에서 다섯 줄 고정 칸이 넘쳤다): 캔버스 단추 줄 아래 자리에 겹쳐 놓고 접어 싸며 위아래로 굴린다.
     나라가 더 늘어도 판만 길어진다 — 합성로 · 단추는 그대로 보이고, 패는 한 칸 44px 이상. 결과 · 수집첩 덮개가 열리면 판을 숨긴다.
     화면 읽기 프로그램에는 결과를 #alchemy-status 로 알린다. 검사용 손잡이 window.AtelierAlchemyGame(state · pick · combine · clear · book · close). -->

<body class="prompt-page lab-page alchemy-page">
<div class="wrap"><div id="app"></div><div id="game" role="application"><div id="tray" class="alchemy-tray" hidden></div></div><p id="alchemy-status" class="sr-only" role="status" aria-live="polite"></p></div>
<script type="module">
import {h,render} from 'https://esm.sh/preact@10.24.3';
import {ToolBar} from './lib/toolbox.js?v=3';
import * as Phaser from 'https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.min.js';
const W=window.W,IMG=window.AtelierImg,AL=window.AtelierAlchemy;
render(h(ToolBar,{tool:'alchemy'}),document.getElementById('app'));
const fitTop=()=>{const g=document.getElementById('game');document.documentElement.style.setProperty('--alchemy-top',Math.ceil(g.getBoundingClientRect().top+window.scrollY)+'px');};
requestAnimationFrame(fitTop);addEventListener('resize',fitTop);
const say=t=>{const s=document.getElementById('alchemy-status');s.textContent='';setTimeout(()=>{s.textContent=t;},30);};

/* 테마 색 — 주기율표와 같은 분류 색(lib/element.css 의 --cat), 바탕 · 글자 · 강조 */
const css=(el,name)=>getComputedStyle(el).getPropertyValue(name).trim();
const hex=c=>{const d=document.createElement('span');d.style.color=c;document.body.appendChild(d);const m=getComputedStyle(d).color.match(/\d+(\.\d+)?/g)||[0,0,0];d.remove();return (+m[0]<<16)+(+m[1]<<8)+(+m[2]|0);};
const ROOT=document.documentElement,TH={bg:hex(css(ROOT,'--bg')||'#0b0d12'),inkHex:hex(css(ROOT,'--text')||'#eee'),ink:css(ROOT,'--text')||'#eee',dim:css(ROOT,'--muted')||'#999',accent:hex(css(ROOT,'--accent')||'#e0b05a'),accentCss:css(ROOT,'--accent')||'#e0b05a'};
const catColor={};
const catOf=k=>{if(catColor[k]!=null)return catColor[k];const p=document.createElement('span');p.className='cat-probe';p.dataset.cat=k;document.body.appendChild(p);const c=css(p,'--cat');p.remove();return catColor[k]=hex(c||'#888');};
const FONT="'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif";
const S=2,GW=420*S,GH=860*S;   /* 논리 크기 두 배 */
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch{return false;}};
/* 합성 연출 단계(2026-11-12 사용자 「합성 성공 연출 손맛 있게 넣어줘」 — 허브 game-feel 스킬의 단계표: 이벤트마다 단계 하나, 그 묶음을 한 번에).
   big = 처음 찾은 물질(모으기 → 터짐 · 번쩍임 한 번 · 입자 · 살짝 흔들림 → 카드 튀어나오기 · 「새 카드 +n」), small = 이미 찾은 물질(입자 조금), fail = 아무 일 없음(회색 김 · 도리질).
   움직임 줄이기면 흔들림 · 번쩍임 · 입자 · 모으기 없이 바로 결과(카드도 뒤집지 않고 앞면). 번쩍임은 합성 한 번에 한 번 — 합성 중엔 다시 못 눌러 1초 세 번을 넘지 않는다(WCAG 2.3.1) */
const FX={big:{burst:28,shake:180,shakeAmt:0.006,flash:true,card:10},small:{burst:8,shake:0,flash:false,card:0},fail:{burst:5,shake:0,flash:false,card:0}};
const T=(scene,x,y,str,size,opt={})=>scene.add.text(x,y,str,Object.assign({fontFamily:FONT,fontSize:(size*S)+'px',color:TH.ink,align:'center'},opt)).setOrigin(0.5);

async function docs(){
  const [d,s,i]=await Promise.all([
    fetch('data/element-design.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status)))),
    fetch('data/style.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status)))),
    fetch(IMG.DATA,{cache:'no-cache'}).then(r=>r.ok?r.json():{img:{}}).catch(()=>({img:{}}))]);
  IMG.setShards(i);
  return AL.build(d,i.img||{},s.default);
}

class Main extends Phaser.Scene{
  constructor(){super('main');}
  init(data){this.game_=data.game;this.state=AL.tidy(data.game,AL.load());this.picks=[];this.busy=false;}
  create(){
    const G=this.game_,cx=GW/2;
    this.cameras.main.setBackgroundColor(TH.bg);
    this.progress=T(this,cx,34*S,'',15,{color:TH.dim});
    /* 합성로 — 빛나는 원, 안에 칸 셋 */
    /* 합성로 — 원(빛 번짐 포함)이 아래 단추 줄에 닿지 않게(사용자 「동그란 부분이 밑에 버튼을 침범하고 있어」): 반지름 92, 번짐 104, 안내 글은 원 밑, 단추는 그 아래 */
    const fy=180*S,R=92*S;
    this.glow=this.add.circle(cx,fy,R+12*S,TH.accent,0.08);
    this.ring=this.add.circle(cx,fy,R).setStrokeStyle(3*S,TH.accent,0.7);
    T(this,cx,fy-62*S,W('alchemy.furnace'),13,{color:TH.dim});
    this.slots=[-1,0,1].map(i=>{
      const x=cx+i*58*S,c=this.add.circle(x,fy,25*S,TH.inkHex,0.05).setStrokeStyle(2*S,TH.inkHex,0.3);
      const t=T(this,x,fy,'',20,{fontStyle:'700'});
      c.setInteractive({useHandCursor:true}).on('pointerdown',()=>{const k=this.picks[i+1];if(k)this.unpick(k);});
      return {c,t};
    });
    this.msg=T(this,cx,fy+R+28*S,W('alchemy.pick'),13,{color:TH.dim,wordWrap:{width:360*S}});
    /* 단추 줄 */
    const by=fy+R+78*S;
    this.btnCombine=this.button(cx,by,W('alchemy.combine'),150,true,()=>this.combine());
    this.button(cx-128*S,by,W('alchemy.clear'),86,false,()=>this.clear());
    this.button(cx+128*S,by,W('alchemy.hint'),86,false,()=>this.hint());
    this.btnBook=this.button(cx,by+52*S,W('alchemy.book'),150,false,()=>this.openBook());
    /* 원소 패 — 주기율표 번호 차례, HTML 단추 판(접어 싸고 위아래로 굴린다). 캔버스의 단추 줄 아래(TRAY_Y)부터 #game 바닥까지 */
    this.trayY=by+52*S+20*S+16*S;
    const tray=document.getElementById('tray');tray.textContent='';this.tokens={};
    G.roots.forEach(r=>{
      const b=document.createElement('button'),sym=document.createElement('b'),name=document.createElement('span');
      b.type='button';b.className='alchemy-tok';b.dataset.cat=r.category;b.dataset.key=r.key;sym.textContent=r.symbol;name.textContent=r.ko;
      b.append(sym,name);b.addEventListener('click',()=>this.toggle(r.key));tray.appendChild(b);this.tokens[r.key]=b;
    });
    const place=()=>{const g=document.getElementById('game').getBoundingClientRect(),c=this.game.canvas.getBoundingClientRect();
      Object.assign(tray.style,{left:(c.left-g.left)+'px',width:c.width+'px',top:(c.top-g.top+this.trayY*c.height/GH)+'px',bottom:'0px'});};
    place();addEventListener('resize',place);new ResizeObserver(place).observe(this.game.canvas);
    tray.hidden=false;
    /* 입자 — 작은 점 텍스처 하나, 터뜨리는 장치 하나를 돌려 쓴다(그때마다 만들지 않는다). 색은 고른 원소의 분류 색 */
    if(!this.textures.exists('spark')){const g=this.add.graphics();g.fillStyle(0xffffff,1);g.fillCircle(8*S,8*S,8*S);g.generateTexture('spark',16*S,16*S);g.destroy();}
    this.burstColors=[TH.accent];
    this.sparks=this.add.particles(0,0,'spark',{emitting:false,speed:{min:120*S,max:330*S},lifespan:{min:450,max:850},scale:{start:0.9,end:0},alpha:{start:1,end:0},
      gravityY:260*S,tint:{onEmit:()=>this.burstColors[Math.floor(Math.random()*this.burstColors.length)]}}).setDepth(1000);
    this.flash=this.add.circle(cx,fy,R+20*S,TH.accent,1).setAlpha(0).setDepth(999);   /* 강조색 — 밝은 테마에선 흰 번쩍임이 바탕에 묻힌다 */
    this.slotBase=this.slots.map(sl=>({x:sl.c.x,y:sl.c.y}));
    this.lastFx=null;
    this.refresh();
    window.AtelierAlchemyGame={ready:true,state:()=>({picks:this.picks.slice(),found:this.state.found.slice(),tries:this.state.tries,total:G.lords.length,overlay:this.overlay?this.overlay.kind:null,cards:this.overlay&&this.overlay.cards||[],msg:this.msg.text,
        fx:this.lastFx,busy:this.busy,rest:{ring:this.ring.scale,glow:this.glow.scale,ringX:this.ring.x,flash:this.flash.alpha,cam:[this.cameras.main.scrollX,this.cameras.main.scrollY],slots:this.slots.map((sl,i)=>[sl.c.x-this.slotBase[i].x,sl.c.y-this.slotBase[i].y,sl.c.scale,sl.t.alpha])}}),
      slow:f=>{this.tweens.timeScale=f;this.time.timeScale=f;this.sparks.timeScale=f;},   /* 검사 · 화면 찍기용 — 연출을 느리게 */
      /* 검사용 — 합성로가 가장 크게 번진 아래 끝(빛 번짐 × 1.35 · 번쩍임 × 1.25 · 합성로 × 1.16)과 단추 줄 위 끝, 마지막 원소 이름 아래 끝 */
      layout:()=>({circleBottom:this.ring.y+Math.max(this.glow.radius*1.35,this.flash.radius*1.25,this.ring.radius*1.16),buttonsTop:this.btnCombine.bg.y-this.btnCombine.bg.height/2,
        buttonsBottom:this.btnBook.bg.y+this.btnBook.bg.height/2,trayY:this.trayY,height:GH}),
      where:k=>{const o=this.tokens[k];if(!o)return null;o.scrollIntoView({block:'nearest'});const r=o.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};},   /* 판 안에서 굴려 보인 뒤 가운데 */
      pick:k=>this.toggle(k),combine:()=>this.combine(),clear:()=>this.clear(),book:()=>this.openBook(),close:()=>this.closeOverlay(),hint:()=>this.hint(),
      reset:()=>{this.state=AL.blank();AL.save(this.state);this.clear();this.refresh();}};
  }
  button(x,y,label,w,main,fn){
    const bg=this.add.rectangle(x,y,w*S,40*S,main?TH.accent:TH.inkHex,main?0.95:0.06).setStrokeStyle(2*S,main?TH.accent:TH.inkHex,main?1:0.3);
    const t=T(this,x,y,label,14,{color:main?'#111':TH.ink,fontStyle:main?'700':'400'});
    bg.setInteractive({useHandCursor:true}).on('pointerdown',()=>{if(!this.overlay)fn();});
    return {bg,t};
  }
  refresh(){
    const G=this.game_;
    /* 수집 수는 결과를 닫을 때 바뀐다(결과 화면에서 하나씩 올라가는 것을 먼저 본다) */
    this.progress.setText(W('alchemy.progress',{n:this.shown!=null?this.shown:this.state.found.length,total:G.lords.length}));
    this.slots.forEach((s,i)=>{const k=this.picks[i],r=k&&G.rootByKey[k];s.t.setText(r?r.symbol:'');s.c.setFillStyle(r?catOf(r.category):TH.inkHex,r?0.35:0.05);});
    Object.entries(this.tokens).forEach(([k,b])=>b.setAttribute('aria-pressed',String(this.picks.includes(k))));
    this.btnCombine.bg.setAlpha(this.picks.length?1:0.4);
  }
  toggle(k){
    if(this.busy||this.overlay)return;
    if(this.picks.includes(k))return this.unpick(k);
    if(this.picks.length>=AL.MAX){this.note(W('alchemy.full'));return;}
    this.picks.push(k);this.refresh();
    const s=this.slots[this.picks.length-1].c;this.tweens.add({targets:s,scale:{from:1.25,to:1},duration:220,ease:'Back.Out'});
  }
  unpick(k){this.picks=this.picks.filter(x=>x!==k);this.refresh();}
  clear(){this.picks=[];this.note(W('alchemy.pick'));this.refresh();}
  note(t,announce){this.msg.setText(t);if(announce!==false)say(t);}
  hint(){const r=AL.hint(this.game_,this.state);AL.save(this.state);this.note(r?W('alchemy.hint.text',r):W('alchemy.hint.done'));}
  /* 연출 한 묶음 — 단계(tier)마다 정해진 것만. 움직임 줄이기면 아무것도 안 한다 */
  feedback(tier,x,y,colors){
    const f=FX[tier],calm=reduced();
    this.lastFx={tier,burst:calm?0:f.burst,shake:!calm&&!!f.shake,flash:!calm&&f.flash};
    if(calm)return;
    this.burstColors=colors&&colors.length?colors:[TH.accent];
    if(f.burst)this.sparks.explode(f.burst,x,y);
    if(f.flash){this.flash.setPosition(x,y).setAlpha(0.45).setScale(0.6);this.tweens.add({targets:this.flash,alpha:0,scale:1.25,duration:240,ease:'Quad.Out',onComplete:()=>this.flash.setAlpha(0).setScale(1)});}
    if(f.shake)this.cameras.main.shake(f.shake,f.shakeAmt);
  }
  combine(){
    if(this.busy||this.overlay||!this.picks.length)return;
    const G=this.game_,picks=this.picks.slice(),res=AL.combine(G,this.state,picks);AL.save(this.state);
    const colors=[...new Set(picks.map(k=>catOf(G.rootByKey[k].category)))],cx=GW/2,cy=this.ring.y;
    if(!res.ok){
      this.note(W(res.why==='inert'?'alchemy.inert':'alchemy.none'));
      this.feedback('fail',cx,cy,[TH.inkHex]);
      if(!reduced())this.tweens.add({targets:[this.ring,this.glow],x:{from:cx-10*S,to:cx},duration:70,yoyo:true,repeat:3,onComplete:()=>{this.ring.x=this.glow.x=cx;}});
      return;
    }
    const names=[...new Set(res.lords.map(k=>G.byKey[k].ko))],tier=res.fresh.length?'big':'small';
    this.shown=this.state.found.length-res.fresh.length;
    this.note(W('alchemy.made',{materials:names.join(' · '),els:picks.map(k=>G.rootByKey[k].symbol).join(' + ')}));
    this.picks=[];
    const done=()=>{this.busy=false;this.refresh();this.reveal(res);};
    if(reduced()){this.feedback(tier,cx,cy,colors);this.refresh();done();return;}
    this.busy=true;
    /* ① 모으기(예비 동작 — 느리게 시작해 빨라지게): 고른 칸들이 가운데로 빨려 들고 합성로가 살짝 움츠린다 */
    const used=this.slots.slice(0,picks.length);
    this.tweens.add({targets:used.flatMap(sl=>[sl.c,sl.t]),x:cx,y:cy,scale:0.35,duration:220,ease:'Cubic.In'});
    this.tweens.add({targets:this.ring,scale:0.9,duration:220,ease:'Cubic.In',onComplete:()=>{
      /* ② 터짐: 합성로가 넘쳤다 제자리(눌렀다 펴기), 빛이 번지고, 입자 · 번쩍임 · 흔들림(단계대로) */
      this.slots.forEach((sl,i)=>{sl.c.setPosition(this.slotBase[i].x,this.slotBase[i].y).setScale(1);sl.t.setPosition(this.slotBase[i].x,this.slotBase[i].y).setScale(1).setAlpha(0);});
      this.refresh();
      this.tweens.add({targets:this.slots.map(sl=>sl.t),alpha:1,duration:200});
      this.ring.setScale(1.16);this.tweens.add({targets:this.ring,scale:1,duration:320,ease:'Back.Out'});
      this.tweens.add({targets:this.glow,scale:{from:1,to:1.35},alpha:{from:0.6,to:0.08},duration:420,ease:'Quad.Out',onComplete:()=>this.glow.setScale(1).setAlpha(0.08)});   /* 번져도 단추 줄 위에서 멈춘다 */
      this.feedback(tier,cx,cy,colors);
      /* ③ 잠깐 숨 — 터진 것을 본 뒤 카드 */
      this.time.delayedCall(tier==='big'?420:260,done);
    }});
  }
  /* 덮개 — 결과(reveal)와 수집첩(book). 바탕을 누르거나 닫기 */
  layer(kind){
    this.closeOverlay();
    const o={kind,items:[],cards:[]};
    const dim=this.add.rectangle(GW/2,GH/2,GW,GH,TH.bg,0.985).setInteractive();   /* 뒤 화면이 비치지 않게 바탕색으로 */
    o.items.push(dim);this.overlay=o;document.getElementById('tray').hidden=true;return o;
  }
  /* 덮개의 트윈만 멈춘다 — 전부(killAll) 멈추면 합성로 · 칸의 움직임까지 끊겨 크기가 중간에 남는다(2026-11-12 game-feel 스킬 점검: 움직임은 늘 제자리로) */
  closeOverlay(){if(!this.overlay)return;this.shown=null;this.tweens.killTweensOf(this.overlay.items);this.overlay.items.forEach(x=>x.destroy());this.overlay=null;document.getElementById('tray').hidden=false;this.refresh();}
  loadPics(keys){
    const want=keys.filter(k=>k&&!this.textures.exists('p:'+k));
    if(!want.length)return Promise.resolve();
    return new Promise(ok=>{want.forEach(f=>this.load.image('p:'+f,IMG.thumbURL(f)));this.load.once('complete',ok);this.load.start();});
  }
  /* 카드 한 장 — 뒷면(원소 기호)에서 앞면(그림 + 이름)으로 */
  card(x,y,w,l,o,{fresh,flipDelay,front}){
    const hgt=w*1.5,G=this.game_;
    const back=this.add.container(x,y);
    back.add(this.add.rectangle(0,0,w,hgt,0x1a1d26,1).setStrokeStyle(2*S,TH.accent,0.8));
    back.add(T(this,0,0,l.elements.map(k=>G.rootByKey[k]?G.rootByKey[k].symbol:k).join('+'),w/S/5,{color:'#f4f1ea',fontStyle:'700'}));   /* 카드는 어두운 판 — 글자는 늘 밝게(테마와 상관없이) */
    const face=this.add.container(x,y).setScale(front?1:0,1);
    const pic=l.pic&&this.textures.exists('p:'+l.pic)?this.add.image(0,0,'p:'+l.pic):null;
    if(pic){const sc=Math.min(w/pic.width,hgt/pic.height);pic.setScale(sc);}   /* 2:3 그림이 카드를 꽉 채운다 — 이름 띠는 그 위에 */
    face.add(this.add.rectangle(0,0,w,hgt,0x10131a,1).setStrokeStyle(2*S,fresh?TH.accent:0xffffff,fresh?1:0.35));
    if(pic)face.add(pic);else face.add(T(this,0,-hgt*0.07,l.ko,w/S/6,{color:'#f4f1ea'}));
    face.add(this.add.rectangle(0,hgt*0.43,w,hgt*0.14,0x000000,0.7));
    face.add(T(this,0,hgt*0.43,W('alchemy.lord',{nation:l.nationKo,family:l.ko}),Math.max(10,w/S/10),{color:'#f4f1ea'}));
    if(fresh)face.add(T(this,w*0.32,-hgt*0.44,W('alchemy.new'),10,{fontStyle:'700',color:'#111',backgroundColor:TH.accentCss,padding:{x:4*S,y:1*S}}));
    o.items.push(back,face);
    if(front||reduced()){back.setVisible(false);face.setScale(1);}
    else this.tweens.add({targets:back,scaleX:0,duration:180,delay:flipDelay,ease:'Quad.In',onComplete:()=>{back.setVisible(false);
      if(!fresh){this.tweens.add({targets:face,scaleX:1,duration:220,ease:'Back.Out'});return;}
      /* 처음 찾은 카드 — 넘치게 튀어나왔다 제자리, 둘레에 반짝이 */
      face.setScale(0,1.08);this.tweens.add({targets:face,scaleX:1.08,duration:200,ease:'Back.Out',onComplete:()=>this.tweens.add({targets:face,scale:1,duration:180,ease:'Quad.Out'})});
      this.burstColors=[TH.accent,0xffffff];this.sparks.explode(FX.big.card,x,y-hgt*0.3);}});
    const hit=this.add.rectangle(x,y,w,hgt,0xffffff,0.001).setInteractive({useHandCursor:true});
    hit.on('pointerdown',()=>{location.href='index.html?n='+l.nation+'&mode=list&'+(l.pic?'card='+encodeURIComponent(l.key)+'&pic='+encodeURIComponent(l.pic):'at='+encodeURIComponent(l.key));});   /* 원소 공방 목록의 그 카드(그림이면 한 장) — 옛 dex.html 넘김을 거치지 않는다 */
    o.items.push(hit);o.cards.push(l.key);
  }
  async reveal(res){
    const G=this.game_,ls=res.lords.map(k=>G.byKey[k]);
    await this.loadPics(ls.map(l=>l.pic));
    const o=this.layer('reveal'),n=ls.length,cols=n>2?2:n,w=(n>2?170:190)*S,rows=Math.ceil(n/cols),hgt=w*1.5,gx=w+16*S,gy=hgt+20*S;
    const top=GH/2-(rows-1)*gy/2-30*S;
    o.items.push(T(this,GW/2,top-hgt/2-46*S,W('alchemy.made.title',{els:[...new Set(ls.flatMap(l=>l.elements))].map(k=>G.rootByKey[k].symbol).join(' + ')}),18,{fontStyle:'700'}));
    ls.forEach((l,i)=>{const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,n-r*cols);
      this.card(GW/2+(c-(inRow-1)/2)*gx,top+r*gy,w,l,o,{fresh:res.fresh.includes(l.key),flipDelay:250+i*260});});
    const done=this.button(GW/2,top+(rows-1)*gy+hgt/2+44*S,W('alchemy.continue'),150,true,()=>{});
    done.bg.removeAllListeners('pointerdown').on('pointerdown',()=>this.closeOverlay());
    o.items.push(done.bg,done.t,T(this,GW/2,top+(rows-1)*gy+hgt/2+84*S,W('alchemy.tap'),11,{color:TH.dim}));
    /* 「새 카드 +n」 — 떠오르며 사라진다(숫자 튀기), 수집 수는 하나씩 올라간다 */
    if(res.fresh.length){
      const gy0=top-hgt/2-82*S,gain=T(this,GW/2,gy0,W('alchemy.gain',{n:res.fresh.length}),15,{fontStyle:'700',color:TH.accentCss});
      const cnt=T(this,GW/2,gy0-30*S,'',12,{color:TH.dim}),from=this.state.found.length-res.fresh.length,G2=this.game_;
      o.items.push(gain,cnt);
      if(reduced())cnt.setText(W('alchemy.progress',{n:this.state.found.length,total:G2.lords.length}));
      else{gain.setScale(0.6).setAlpha(0);this.tweens.add({targets:gain,scale:1,alpha:1,y:gy0-6*S,duration:320,ease:'Back.Out',delay:250});
        const c={v:from};this.tweens.add({targets:c,v:this.state.found.length,duration:500,delay:400,ease:'Quad.Out',onUpdate:()=>{if(cnt.active)cnt.setText(W('alchemy.progress',{n:Math.round(c.v),total:G2.lords.length}));},onComplete:()=>{if(cnt.active)cnt.setText(W('alchemy.progress',{n:this.state.found.length,total:G2.lords.length}));}});   /* 덮개를 먼저 닫아도(글자가 지워져도) 탈 없게 */
        cnt.setText(W('alchemy.progress',{n:from,total:G2.lords.length}));}
    }
    say(W(res.fresh.length?'alchemy.say.new':'alchemy.say.again',{cards:ls.map(l=>W('alchemy.lord',{nation:l.nationKo,family:l.ko})).join(', ')}));
  }
  async openBook(){
    if(this.busy)return;
    const G=this.game_,found=this.state.found;
    await this.loadPics(G.lords.filter(l=>found.includes(l.key)).map(l=>l.pic));
    const o=this.layer('book'),cols=5,w=74*S,hgt=w*1.5,gx=w+8*S,gy=hgt+10*S,x0=GW/2-(cols-1)/2*gx,y0=96*S+hgt/2;   /* 다섯 칸 · 다섯 줄 — 폰 한 화면 */
    o.items.push(T(this,GW/2,46*S,W('alchemy.book.title',{n:found.length,total:G.lords.length}),18,{fontStyle:'700'}));
    G.lords.forEach((l,i)=>{const x=x0+(i%cols)*gx,y=y0+Math.floor(i/cols)*gy;
      if(found.includes(l.key))this.card(x,y,w,l,o,{front:true,fresh:false});
      else{const b=this.add.rectangle(x,y,w,hgt,TH.inkHex,0.04).setStrokeStyle(2*S,TH.inkHex,0.18);
        o.items.push(b,T(this,x,y,'?',26,{color:TH.dim}),T(this,x,y+hgt*0.36,W('alchemy.locked',{count:l.elements.length}),10,{color:TH.dim}));}});
    const rows=Math.ceil(G.lords.length/cols),bt=this.button(GW/2,Math.min(GH-40*S,y0+(rows-1)*gy+hgt/2+40*S),W('alchemy.close'),150,true,()=>{});
    bt.bg.removeAllListeners('pointerdown').on('pointerdown',()=>this.closeOverlay());
    o.items.push(bt.bg,bt.t);
    say(W('alchemy.book.title',{n:found.length,total:G.lords.length}));
  }
}

docs().then(game=>{
  new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:TH.bg,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:GW,height:GH},
    loader:{crossOrigin:'anonymous'},banner:false,scene:[]}).scene.add('main',Main,true,{game});
}).catch(()=>{document.getElementById('game').innerHTML='';const p=document.createElement('p');p.className='alchemy-note';p.textContent=W('alchemy.fail');document.getElementById('game').appendChild(p);});
</script>
