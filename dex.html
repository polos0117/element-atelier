  const [wf,setWfS]=useState(()=>{const w=param('w')??pref.w??'';return ['fantasy','steampunk','mecha'].includes(w)?w:'';});
  const [stS,setStS]=useState(()=>param('st')||pref.st||'');
  const [open,setOpen]=useState({}),[box,setBox]=useState(null),deep=useRef(false);
  /* 화풍 — 모르는 열쇠(지운 화풍 · 옛 저장값)면 기본 화풍. 기본 화풍이면 주소에서 뺀다 */
  const st=doc&&!doc.failed&&doc.s.styles&&doc.s.styles[stS]?stS:(doc&&!doc.failed?doc.s.default:'');
  const remember=(v,w,s)=>{savePref({view:v,w,st:s});try{const u=new URL(location.href);u.searchParams.set('view',v);if(w)u.searchParams.set('w',w);else u.searchParams.delete('w');if(s&&doc&&s!==doc.s.default)u.searchParams.set('st',s);else u.searchParams.delete('st');u.searchParams.delete('card');u.searchParams.delete('pic');history.replaceState(history.state,'',u);}catch{}};
  /* 크게 보기와 뒤로 가기 — 열 때 기록에 한 칸(elementLb)을 더해 두면 뒤로 가기가 그 칸을 지우며 팝업만 닫는다(사용자 2026-10-31 「뒤로 가기 누르면 이전 화면으로 넘어가네」).
     닫기·Esc·바깥으로 닫으면 그 칸을 우리가 지운다 — 다음 뒤로 가기는 그대로 이전 화면 */
  const isLb=()=>!!(history.state&&history.state.elementLb);
  const openBox=b=>{if(!isLb()){try{history.pushState({elementLb:1},'',location.href);}catch{}}setBox(b);};
  const closeBox=()=>{if(isLb()){try{history.back();return;}catch{}}setBox(null);};
  useEffect(()=>{const pop=()=>{if(!isLb())setBox(null);};addEventListener('popstate',pop);return()=>removeEventListener('popstate',pop);},[]);
  const setView=v=>{setViewS(v);remember(v,wf,st);},setWf=w=>{setWfS(w);remember(view,w,st);},setSt=s=>{setStS(s);setOpen({});remember(view,wf,s);};
  /* 공방 모음 즐겨찾기에서 ?card=&pic= 로 오면 그 카드로 내려가 그 그림을 연다 */
  useEffect(()=>{if(!doc||doc.failed||deep.current)return;deep.current=true;const ck=param('card'),pic=param('pic');if(!ck)return;
    const n=doc.d.nations.find(x=>x.key===ck.split('-')[0]);if(!n)return;const c=cardsOf(doc,n).find(x=>x.key===ck);if(!c)return;
    setTimeout(()=>{const el=document.getElementById('c-'+ck);if(el)el.scrollIntoView({block:'start'});},50);
    const ps=pic&&styleOfPic(doc,c,pic);if(ps){if(ps!==st)setStS(ps);openBox({card:c,file:pic,nation:n.key,st:ps});}},[doc]);
  if(!doc)return h('p',{class:'ek-note'},W('dex.loading'));
  if(doc.failed)return h('p',{class:'ek-note'},W('dex.fail'));
  const d=doc.d,want=param('nation')||(param('card')||'').split('-')[0],n=d.nations.find(x=>x.key===want)||d.nations[0];
  if(!n)return h('p',{class:'ek-note'},W('dex.none'));
  return h('div',null,
    h('nav',{class:'dex-pick','aria-label':W('dex.pick')},d.nations.map(x=>{const e=d.elements.find(y=>y.key===x.key)||{};
      return h('a',{key:x.key,href:'dex.html?nation='+x.key,'aria-current':x.key===n.key?'page':undefined,'data-cat':e.category},h('span',{class:'sym'},e.symbol),e.ko);})),
    h(Nation,{doc,n,view,setView,wf,setWf,st,setSt,open,setOpen,favs,onOpen:(card,file)=>openBox({card,file,nation:n.key,st})}),
    h(Lightbox,{doc,box,setBox,close:closeBox,favs}));
}
function App(){return h('div',null,h(WorkspaceHeader,{page:'dex'}),h(Dex));}
render(h(App),document.getElementById('app'));
window.AtelierFresh.watch();
</script>
